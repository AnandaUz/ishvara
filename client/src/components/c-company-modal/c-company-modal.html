<div class="company-modal-content">
  <div class="modal-header">
    <h2>Управление компаниями проекта</h2>
    <button class="btn-close" type="button">&times;</button>
  </div>

  <div class="company-list-section">
    <div class="actions-bar">
      <button class="btn-add-company" type="button">+ Создать компанию</button>
    </div>
    <div class="companies-list">
      <!-- Список компаний -->
    </div>
  </div>

  <div class="company-form-section" style="display: none;">
    <h3 class="form-title">Новая компания</h3>
    <input type="hidden" class="company-id" />
    <div class="form-group">
      <label>Название компании (гипотезы):</label>
      <input type="text" class="input-name" placeholder="Например: Тест посадочной Египет" />
    </div>
    <div class="form-group">
      <label>Адреса страниц (каждый адрес с новой строки или полный URL):</label>
      <textarea class="textarea-urls" rows="6" placeholder="/tours/egypt&#10;https://world-travel.uz/tours/dubai"></textarea>
    </div>
    <div class="form-actions">
      <button class="btn-save" type="button">Сохранить</button>
      <button class="btn-cancel" type="button">Отмена</button>
    </div>
  </div>
</div>
